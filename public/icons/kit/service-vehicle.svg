<clipPath id="glass"><rect x="6" y="28" width="80" height="66" rx="24" /></clipPath>
<clipPath id="backclip"><rect x="34" y="4" width="58" height="58" rx="20" transform="rotate(15 63.0 33.0)" /></clipPath>
</defs>
<g id="behind"><rect x="34" y="4" width="58" height="58" rx="20" transform="rotate(15 63.0 33.0)" fill="url(#back)"/><g clip-path="url(#backclip)"><g opacity=".5" filter="url(#glow)"><rect x="34" y="4" width="58" height="58" rx="20" transform="rotate(15 63.0 33.0)" fill="#30AD31"/></g></g></g>
<g clip-path="url(#glass)"><use xlink:href="#behind" filter="url(#frost)"/></g>
<rect x="6" y="28" width="80" height="66" rx="24" fill="rgba(114,220,96,.35)" stroke="url(#edge)" stroke-width="1.5"/>
