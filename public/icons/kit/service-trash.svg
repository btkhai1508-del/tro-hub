<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
<linearGradient id="back" x1="90" y1="5" x2="20" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#FFA78F"/><stop offset="1" stop-color="#F23E2C"/></linearGradient>
