</defs>
<g id="behind"><rect x="36" y="4" width="56" height="56" rx="18" transform="rotate(12 64.0 32.0)" fill="url(#back)"/><g clip-path="url(#backclip)"><g opacity=".5" filter="url(#glow)"><rect x="36" y="4" width="56" height="56" rx="18" transform="rotate(12 64.0 32.0)" fill="#FF3D22"/></g></g></g>
