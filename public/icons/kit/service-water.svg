<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
<linearGradient id="back" x1="90" y1="5" x2="20" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#39AFFD"/><stop offset="1" stop-color="#477FFF"/></linearGradient>
<linearGradient id="edge" x1="10" y1="20" x2="90" y2="95" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="white" x1="92" y1="50" x2="8" y2="53" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
<filter id="glow" x="-40" y="-40" width="180" height="180" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="frost" x="-60" y="-60" width="220" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="lift" x="-30" y="-30" width="170" height="170" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgb(39,133,230)" flood-opacity=".55"/></filter>
<clipPath id="glass"><path d="M46 26C50 33 72 54 72 73C72 87 60 97 46 97C32 97 20 87 20 73C20 54 42 33 46 26Z" /></clipPath>
<clipPath id="backclip"><circle cx="66" cy="34" r="28" /></clipPath>
</defs>
<g id="behind"><circle cx="66" cy="34" r="28" fill="url(#back)"/><g clip-path="url(#backclip)"><g opacity=".5" filter="url(#glow)"><circle cx="66" cy="34" r="28" fill="#0062FF"/></g></g></g>
<g clip-path="url(#glass)"><use xlink:href="#behind" filter="url(#frost)"/></g>
<path d="M46 26C50 33 72 54 72 73C72 87 60 97 46 97C32 97 20 87 20 73C20 54 42 33 46 26Z" fill="rgba(62,160,254,.35)" stroke="url(#edge)" stroke-width="1.5"/>
<g filter="url(#lift)"><path d="M33 74C33 82 39 86 46 86" stroke-width="6.500" stroke="url(#white)" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
