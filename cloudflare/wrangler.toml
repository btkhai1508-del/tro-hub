name = "tro-hub-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "tro-hub"
database_id = "9cd50386-7968-465c-ac1e-c8835eeb7c74"
migrations_dir = "migrations"

# Kho dữ liệu riêng của từng chủ trọ: một Durable Object (SQLite) cho mỗi "owner:<staff.id>".
[[durable_objects.bindings]]
name = "TENANT"
class_name = "TenantStore"

[exports.TenantStore]
type = "durable-object"
storage = "sqlite"

# Secret không để ở đây:
#   chạy local: cloudflare/.dev.vars (JWT_SECRET=...)
#   trên Cloudflare: npx wrangler secret put JWT_SECRET

# Mỗi ngày 2 giờ sáng (giờ Việt Nam): xoá hẳn các căn trọ đã hết 7 ngày chờ xoá.
[triggers]
crons = ["0 19 * * *", "*/10 * * * *"] # 19:00 UTC: xoá nhà hết hạn; mỗi 10 phút: đọc số tiền từ Sheet cũ

[vars]
# Trang được phép gọi API từ trình duyệt: app chạy trên máy, bản trên Render, Zalo Mini App.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5199,https://tro-hub.onrender.com,https://h5.zdn.vn,zbrowser://h5.zdn.vn"
# Tài khoản đã đăng ký với Zalo Checkout ("<BIN ngân hàng>:<STK>"). Nhà nào nhận tiền đúng tài khoản này
# thì cư dân thấy nút chuyển khoản nhanh qua Zalo.
ZALO_CHECKOUT_ACCOUNT = "970422:0902371800"
