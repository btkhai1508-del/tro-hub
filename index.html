    <script>
      (function() {
        // Gracefully prevent unhandled promise rejections and console errors from third-party SDKs when running in a web browser
        function isSuppressedError(err) {
          if (!err) return false;
          if (typeof err === 'object') {
            if (err.code === -2000 || err.api === 'login') return true;
          }
          var str = '';
          try {
            str = typeof err === 'string' ? err : JSON.stringify(err);
          } catch (e) {
            str = String(err);
          }
          if (str.indexOf('-2000') !== -1 || str.indexOf('Unknown error. Please try again later.') !== -1) return true;
          if (str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) return true;
          return false;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isSuppressedError(event && event.reason)) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.stopPropagation && event.stopPropagation();
            event.preventDefault && event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var err = event && (event.error || event.message);
          if (isSuppressedError(err)) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.stopPropagation && event.stopPropagation();
            event.preventDefault && event.preventDefault();
            return true;
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isSuppressedError(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // Mock WebSocket for Vite HMR in cloud dev environments where WebSocket proxying is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          try {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = String(protocols || '');
              if (urlStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('token=') !== -1) {
                var listeners = {};
                var mockWs = {
                  readyState: 1,
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, cb) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(cb);
                    if (type === 'open') setTimeout(function() { cb({ type: 'open' }); }, 0);
                  },
                  removeEventListener: function(type, cb) {
                    if (listeners[type]) listeners[type] = listeners[type].filter(function(f) { return f !== cb; });
                  },
                  dispatchEvent: function() { return true; }
                };
                return mockWs;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
